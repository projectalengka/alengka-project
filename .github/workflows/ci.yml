name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # Postgres sungguhan supaya migrasi, seed, dan build diuji terhadap database
    # nyata — bukan hanya dikompilasi lalu diasumsikan bekerja.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/design_studio
      NEXT_TELEMETRY_DISABLED: "1"
      # Diperlukan karena next build menulis .next/trace; tanpa ini sebagian
      # lingkungan gagal dengan EPERM saat mengumpulkan build trace.
      NEXT_TRACE_UPLOAD_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Apply migrations to a real database
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Production build
        run: npm run build
